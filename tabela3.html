<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de fluxo de oxigênio</title>
    <link rel="stylesheet" href="css/tabela3.css">
</head>
<body>
    <main>
        <table aria-label="Fluxos de oxigênio e ar por FiO2 e fluxo total, em litros por minuto">
            <colgroup>
                <col class="col-fio2">
                <col class="col-oxigenio">
                <col class="col-ar">
                <col class="col-total">
            </colgroup>
            <thead>
                <tr>
                    <th >FiO2</th>
                    <th >O2 flow<br>LPM</th>
                    <th >Air flow LPM</th>
                    <th >TOTAL<br>FLOW LPM</th>
                </tr>
            </thead>
            <tbody class="grupo-cinza">
                <tr><th>21%</th><td>0</td><td>35</td><td class="total" rowspan="7">35</td></tr>
                <tr><th>30%</th><td>4</td><td>31</td></tr>
                <tr><th>40%</th><td>8</td><td>27</td></tr>
                <tr><th>50%</th><td>13</td><td>22</td></tr>
                <tr><th>60%</th><td>17</td><td>18</td></tr>
                <tr><th>70%</th><td>22</td><td>13</td></tr>
                <tr><th>80%</th><td>26</td><td>9</td></tr>
            </tbody>
            <tbody>
                <tr><th>21%</th><td>0</td><td>40</td><td class="total" rowspan="7">40</td></tr>
                <tr><th>30%</th><td>5</td><td>35</td></tr>
                <tr><th>40%</th><td>10</td><td>30</td></tr>
                <tr><th>50%</th><td>15</td><td>25</td></tr>
                <tr><th>60%</th><td>20</td><td>20</td></tr>
                <tr><th>70%</th><td>25</td><td>15</td></tr>
                <tr><th>80%</th><td>30</td><td>10</td></tr>
            </tbody>
            <tbody class="grupo-cinza">
                <tr><th>21%</th><td>0</td><td>45</td><td class="total" rowspan="7">45</td></tr>
                <tr><th>30%</th><td>5</td><td>40</td></tr>
                <tr><th>40%</th><td>11</td><td>34</td></tr>
                <tr><th>50%</th><td>17</td><td>28</td></tr>
                <tr><th>60%</th><td>22</td><td>23</td></tr>
                <tr><th>70%</th><td>28</td><td>17</td></tr>
                <tr><th>80%</th><td>34</td><td>11</td></tr>
            </tbody>
        </table>
    </main>
</body>
</html>
