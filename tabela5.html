<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela com imagens</title>
    <link rel="stylesheet" href="css/tabela5.css">
</head>
<body>
    <table aria-label="Frutas e suas imagens" lang="en">
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Picture</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Apple</td>
                <td><img src="imagens/apple.jpg" alt="Red apple"></td>
            </tr>
            <tr>
                <td>Banana</td>
                <td><img src="imagens/banana.jpg" alt="Bunch of yellow bananas"></td>
            </tr>
            <tr>
                <td>Peach</td>
                <td><img src="imagens/peach.jpg" alt="Peach and a peach cut in half"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
